name: Release MacPatro Native

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "Release tag must point to a commit on main" >&2
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create RemoteURL.swift
        run: |
          cat > MacPatroNative/Sources/RemoteURL.swift <<'EOF'
          import Foundation

          struct RemoteURL {
              static let urlString = "${{ secrets.REMOTE_URL }}"
          }
          EOF

      - name: Build application
        run: ./build.sh "$VERSION"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          VERSIONED_DMG="dist/Mac-Patro-v${VERSION}.dmg"
          create-dmg \
            --volname "Mac Patro Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Mac Patro.app" 200 190 \
            --hide-extension "Mac Patro.app" \
            --app-drop-link 600 185 \
            "$VERSIONED_DMG" \
            "dist/Mac Patro.app"
          cp "$VERSIONED_DMG" dist/Mac-Patro-latest.dmg

      - name: Calculate SHA256
        run: |
          SHA=$(shasum -a 256 dist/Mac-Patro-latest.dmg | awk '{print $1}')
          echo "CASK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "SHA256: $SHA"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            ## Mac Patro v${{ env.VERSION }}

            Homebrew cask SHA256: `${{ env.CASK_SHA }}`
          draft: false
          prerelease: false

      - name: Update Homebrew cask on main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/version \"[^\"]+\"/version \"$VERSION\"/" Casks/mac-patro.rb
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"$CASK_SHA\"/" Casks/mac-patro.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mac-patro.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(homebrew): update cask to v$VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
